<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player.com</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
        }
        .navbar {
            background-color: #000000 !important;
            border-bottom: 1px solid #222222;
        }
        .navbar-brand, .navbar-light .navbar-brand {
            color: #ffffff !important;
            transition: all 0.3s ease;
        }
        .navbar-brand:hover {
            text-shadow: 0 0 10px rgba(255,255,255,0.7);
        }
        .text-primary {
            color: #6c9fff !important;
        }
        .hero-carousel .carousel-item {
            height: 70vh;
            background-size: cover;
            background-position: center;
        }
        .hero-carousel .carousel-caption {
            background-color: rgba(0,0,0,0.7);
            border-radius: 10px;
            padding: 20px;
        }
        .video-gallery {
            padding: 4rem 0;
            background-color: #000000;
        }
        .video-card {
            display: block;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            color: #e0e0e0;
            text-decoration: none;
        }
        .video-card:hover {
            transform: translateY(-5px);
        }
        .video-thumbnail {
            height: 200px;
            background-color: #121212;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 10px;
            border: 1px solid #333333;
            transition: all 0.3s ease;
        }
        .video-card:hover .video-thumbnail {
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            border-color: rgba(255,255,255,0.5);
        }
        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-thumbnail .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 3rem;
            opacity: 0.8;
            transition: all 0.2s;
        }
        .video-card:hover .play-icon {
            opacity: 1;
            font-size: 3.5rem;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 20px rgba(108,159,255,0.7);
        }
        .video-title {
            font-weight: 600;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .video-card:hover .video-title {
            text-shadow: 0 0 8px rgba(255,255,255,0.7);
        }
        .text-muted {
            color: #aaaaaa !important;
        }
        .bg-light {
            background-color: #121212 !important;
        }
        footer {
            background-color: #121212 !important;
            color: #aaaaaa;
            border-top: 1px solid #333333;
        }
        footer a {
            color: #6c9fff !important;
            transition: all 0.3s ease;
            position: relative;
        }
        footer a:hover {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(255,255,255,0.7);
        }
        /* Glowing button style for any buttons */
        .btn-primary {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #6c9fff;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #000000;
            box-shadow: 0 0 15px rgba(255,255,255,0.5), 0 0 30px rgba(108,159,255,0.3);
            border-color: #ffffff;
        }

        /* Simplified Navbar Styles */
        .navbar {
            background-color: #000000;
            border-bottom: 1px solid #222222;
            padding: 15px 0;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-size: 1.8rem;
            letter-spacing: 1px;
            transition: all 0.4s ease;
        }

        .navbar-brand:hover {
            transform: scale(1.05);
        }

        .text-primary {
            color: #6c9fff !important;
            text-shadow: 0 0 5px rgba(108, 159, 255, 0.4);
        }

        .player-text {
            color: #ffffff;
            transition: all 0.4s ease;
        }

        .navbar-brand:hover .player-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <!-- Simplified Navigation -->
    <nav class="navbar navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold mx-auto" href="#">
                <span class="text-primary">Media</span><span class="player-text">Player</span>
            </a>
        </div>
    </nav>

    <!-- Video Gallery -->
    <section class="video-gallery py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="fw-bold">My Videos</h2>
                <p class="lead text-muted">Watch your local media</p>
            </div>
            <div class="row g-4">
                <!-- Video cards -->
                <div class="col-md-4 col-sm-6" th:each="video : ${videos}">
                    <a th:href="@{/videos/{fileName}(fileName=${#uris.escapePathSegment(video)})}" class="video-card">
                        <div class="video-thumbnail">
                            <div class="play-icon">
                                <i class="bi bi-play-circle"></i>
                            </div>
                        </div>
                        <h5 class="video-title" th:text="${#strings.replace(#strings.replace(video, '.mp4', ''), '_', ' ')}">Video Title</h5>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="mb-0">&copy; 2023 MediaPlayer.com. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="#" class="text-decoration-none me-3">Privacy Policy</a>
                    <a href="#" class="text-decoration-none me-3">Terms of Service</a>
                    <a href="#" class="text-decoration-none">Contact</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
